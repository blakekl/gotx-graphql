name: Synthetic API contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_TEST_RUN: contracts-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI provisioning only. Tests always use --pull=never, no host data volumes,
      # no DB secrets, and only an ephemeral loopback port on their owned DB.
      - run: docker pull postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      - run: npm test
      - run: npm run lint
      - run: npm run test:e2e
      - run: npm run build
      - name: Clean owned fixture DB even if a runner is interrupted
        if: always()
        shell: bash
        run: |
          for id in $(docker ps -aq --filter "label=api-contract-run=$API_TEST_RUN"); do
            docker stop "$id"
          done
